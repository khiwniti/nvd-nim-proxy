[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nim-claude-proxy"
version = "0.3.0"
description = "Anthropic Messages → NVIDIA NIM Proxy for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "khiwniti" },
]
keywords = [
    "anthropic",
    "claude",
    "nvidia",
    "nim",
    "proxy",
    "ai",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx[http2]>=0.27",
    "orjson>=3.10",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.scripts]
nim = "nim_code:main"
nim-proxy = "proxy:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "proxy.py",
    "nim_code.py",
    "config.example.yaml",
    ".env.example",
]

[tool.hatch.build.targets.sdist]
include = [
    "proxy.py",
    "nim_code.py",
    "config.example.yaml",
    ".env.example",
    "README.md",
    "requirements.txt",
    "tests/",
]
